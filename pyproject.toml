[project]
name = "stardew-vision-training"
version = "0.1.0"
description = "Training repository for Stardew Vision VLM fine-tuning and dataset preparation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "transformers>=4.48.0",
    "accelerate>=1.0.0",
    "peft>=0.14.0",
    "trl>=0.12.0",
    "datasets>=3.0.0",
    "evaluate>=0.4.0",
    "qwen-vl-utils>=0.0.8",
    "ray[default,train]>=2.40.0",
    "deepspeed>=0.15.0",
    "mlflow>=2.16.0",
    "paddleocr>=2.9.0",
    "paddlepaddle==3.2.0",
    "opencv-python>=4.10.0",
    "pillow>=11.0.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "openai>=1.0.0",
    "pyyaml>=6.0.0",
    "tqdm>=4.66.0",
    "jsonlines>=4.0.0",
    "python-dotenv>=1.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "ipython>=8.12.0",
    "jupyter>=1.0.0",
]

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[tool.uv]
exclude-dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "scipy",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "W",
]
ignore = [
    "E501",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=fine_tuning --cov=evaluation --cov=synthetic_data"
