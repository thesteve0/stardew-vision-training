# KubeRay RayJob for Stardew Vision LoRA fine-tuning on OpenShift AI
#
# Prerequisites:
#   1. KubeRay operator installed on the cluster
#   2. Kubernetes secrets: s3-credentials, mlflow-credentials, hf-credentials
#   3. EFS PVCs: training-data (populated with datasets), training-checkpoints
#   4. Container image built via: oc start-build stardew-training --from-dir=.
#
# Usage:
#   oc apply -f deploy/rayjob.yaml
#   oc logs -f job/stardew-lora-train -n stardew-vision-training

apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: stardew-lora-train
  namespace: stardew-vision-training
spec:
  entrypoint: >-
    python -m fine_tuning.qwen.train_ray
    --config /app/fine_tuning/qwen/lora_config_cluster.yaml
    --num-workers 2
    --storage-path /checkpoints/ray-results/

  runtimeEnvYAML: |
    env_vars:
      NCCL_DEBUG: "INFO"
      TRAINING_DATA_ROOT: "/data"
      MLFLOW_WORKSPACE: "stardew-vision-training"

  shutdownAfterJobFinishes: true
  ttlSecondsAfterFinished: 3600

  rayClusterSpec:
    headGroupSpec:
      rayStartParams:
        dashboard-host: "0.0.0.0"
      template:
        spec:
          containers:
            - name: ray-head
              image: image-registry.openshift-image-registry.svc:5000/stardew-vision-training/stardew-training:latest
              resources:
                requests:
                  cpu: "2"
                  memory: "8Gi"
                limits:
                  cpu: "4"
                  memory: "8Gi"
              env:
                - name: MLFLOW_WORKSPACE
                  value: "stardew-vision-training"
              envFrom:
                - secretRef:
                    name: s3-credentials
                - secretRef:
                    name: mlflow-credentials
              volumeMounts:
                - name: training-data
                  mountPath: /data
                  readOnly: true
                - name: training-checkpoints
                  mountPath: /checkpoints
          volumes:
            - name: training-data
              persistentVolumeClaim:
                claimName: training-data
            - name: training-checkpoints
              persistentVolumeClaim:
                claimName: training-checkpoints

    workerGroupSpecs:
      - replicas: 2
        minReplicas: 2
        maxReplicas: 2
        groupName: gpu-workers
        rayStartParams:
          num-gpus: "1"
        template:
          spec:
            containers:
              - name: ray-worker
                image: image-registry.openshift-image-registry.svc:5000/stardew-vision-training/stardew-training:latest
                resources:
                  requests:
                    cpu: "4"
                    memory: "32Gi"
                    nvidia.com/gpu: 1
                  limits:
                    cpu: "8"
                    memory: "48Gi"
                    nvidia.com/gpu: 1
                env:
                  - name: MLFLOW_WORKSPACE
                    value: "stardew-vision-training"
                envFrom:
                  - secretRef:
                      name: s3-credentials
                  - secretRef:
                      name: mlflow-credentials
                volumeMounts:
                  - name: training-data
                    mountPath: /data
                    readOnly: true
                  - name: training-checkpoints
                    mountPath: /checkpoints
            volumes:
              - name: training-data
                persistentVolumeClaim:
                  claimName: training-data
              - name: training-checkpoints
                persistentVolumeClaim:
                  claimName: training-checkpoints
            tolerations:
              - key: nvidia.com/gpu
                operator: Exists
                effect: NoSchedule
