# Tiny LoRA config for quick iteration (Tier 0 dry run / Tier 1 tiny training)
# Uses train_tiny.jsonl (40 samples, 10 per screen type)

model_name: "Qwen/Qwen2.5-VL-7B-Instruct"
torch_dtype: "float16"

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
  bias: "none"
  task_type: "CAUSAL_LM"

training:
  output_dir: "experiments/qwen-tiny-v1"
  num_train_epochs: 1
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 1.0e-4
  warmup_steps: 5
  logging_steps: 1
  save_steps: 999999
  eval_steps: 999999
  eval_strategy: "no"
  save_strategy: "epoch"
  save_total_limit: 1
  load_best_model_at_end: false
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  fp16: true
  bf16: false
  dataloader_num_workers: 2
  gradient_checkpointing: true
  optim: "adamw_torch"
  lr_scheduler_type: "cosine"
  max_grad_norm: 1.0
  report_to: "mlflow"

data:
  train_file: "datasets/splits/train_tiny.jsonl"
  eval_file: "datasets/splits/val.jsonl"

mlflow:
  experiment_name: "qwen-tool-selection-train"
  tracking_uri: "experiments/mlruns"
  run_name: "tiny-v1"

seed: 42
