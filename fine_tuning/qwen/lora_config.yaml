# LoRA Fine-Tuning Configuration for Qwen2.5-VL-7B (Phase 1: Tool Selection)
# Full training on all synthetic data (Tier 2)

model_name: "Qwen/Qwen2.5-VL-7B-Instruct"
torch_dtype: "float16"  # REQUIRED for ROCm gfx1151 — no BF16 support

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
  bias: "none"
  task_type: "CAUSAL_LM"

training:
  output_dir: "experiments/qwen-tool-select-v1"
  num_train_epochs: 3
  per_device_train_batch_size: 2      # 48GB VRAM supports batch 2
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 4      # effective batch = 8
  learning_rate: 1.0e-4               # conservative for LoRA
  warmup_steps: 50
  logging_steps: 10
  save_steps: 100
  eval_steps: 100
  eval_strategy: "steps"
  save_strategy: "steps"
  save_total_limit: 3
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  fp16: true
  bf16: false
  dataloader_num_workers: 4
  gradient_checkpointing: true
  optim: "adamw_torch"
  lr_scheduler_type: "cosine"
  max_grad_norm: 1.0
  report_to: "mlflow"

data:
  train_file: "datasets/splits/train.jsonl"
  eval_file: "datasets/splits/val.jsonl"

mlflow:
  experiment_name: "qwen-tool-selection-train"
  tracking_uri: "experiments/mlruns"
  run_name: "tool-select-v1"

seed: 42
