# LoRA Fine-Tuning Configuration for KubeRay on OpenShift AI
# NVIDIA L40S GPUs (48GB VRAM, BF16 capable), 2 workers
#
# Submitted via deploy/rayjob.yaml, not run directly:
#   kubectl apply -f deploy/rayjob.yaml
#
# Placeholder values marked with CHANGEME must be updated before use.

model_name: "Qwen/Qwen2.5-VL-7B-Instruct"
torch_dtype: "bfloat16"  # NVIDIA L40S supports BF16

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
  bias: "none"
  task_type: "CAUSAL_LM"

training:
  output_dir: "/tmp/ray-train-output"  # Local worker dir; checkpoints go to RunConfig.storage_path
  num_train_epochs: 3
  per_device_train_batch_size: 4        # L40S 48GB VRAM supports batch 4
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 2        # effective batch = 4 * 2 workers * 2 = 16
  learning_rate: 1.0e-4
  warmup_steps: 50
  logging_steps: 10
  save_steps: 100
  eval_steps: 100
  eval_strategy: "steps"
  save_strategy: "steps"
  save_total_limit: 3
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  fp16: false
  bf16: true                            # BF16 on NVIDIA L40S
  dataloader_num_workers: 4
  gradient_checkpointing: true
  optim: "adamw_torch"
  lr_scheduler_type: "cosine"
  max_grad_norm: 1.0
  report_to: "mlflow"

data:
  train_file: "s3://CHANGEME/datasets/splits/train.jsonl"
  eval_file: "s3://CHANGEME/datasets/splits/val.jsonl"
  image_base_path: "s3://CHANGEME"      # Prepended to image paths in JSONL

mlflow:
  experiment_name: "qwen-tool-selection-train"
  tracking_uri: "http://mlflow.apps.CHANGEME"  # Cluster MLflow instance
  run_name: "tool-select-cluster-v1"

seed: 42
