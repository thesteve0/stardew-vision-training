# LoRA Fine-Tuning Configuration for KubeFlow PyTorchJob on OpenShift AI
# NVIDIA L40S GPUs (48GB VRAM, BF16 capable), 2 workers (Master + 1 Worker)
#
# Submitted via deploy/pytorchjob.yaml, not run directly:
#   oc apply -f deploy/pytorchjob.yaml
#
# Training data is mounted via PVC at /data. The TRAINING_DATA_ROOT
# env var in pytorchjob.yaml points train_kubeflow.py to /data so all relative
# paths (datasets/splits/*.jsonl, datasets/*/images/*) resolve correctly.

model_name: "Qwen/Qwen2.5-VL-7B-Instruct"
torch_dtype: "bfloat16"  # NVIDIA L40S supports BF16

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
  bias: "none"
  task_type: "CAUSAL_LM"

training:
  output_dir: "/checkpoints/model-output"
  num_train_epochs: 3
  per_device_train_batch_size: 4        # L40S 48GB VRAM supports batch 4
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 1        # effective batch = 4 * 2 workers * 1 = 8 (matches local)
  learning_rate: 1.0e-4
  warmup_steps: 50
  logging_steps: 10
  save_steps: 100
  eval_steps: 100
  eval_strategy: "epoch"
  save_strategy: "epoch"
  save_total_limit: 3
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  fp16: false
  bf16: true                            # BF16 on NVIDIA L40S
  dataloader_num_workers: 4
  gradient_checkpointing: true
  optim: "adamw_torch"
  lr_scheduler_type: "cosine"
  max_grad_norm: 1.0
  report_to: "none"

data:
  train_file: "datasets/splits/train.jsonl"
  eval_file: "datasets/splits/val.jsonl"

mlflow:
  experiment_name: "qwen-tool-selection-train"
  tracking_uri: "https://mlflow.redhat-ods-applications.svc:8443"
  run_name: "tool-select-kubeflow-v1"

seed: 42
